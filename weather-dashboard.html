<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/weather-style.css">
    <link rel="stylesheet" href="css/weather-responsive.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🌤️ Weather Dashboard</h1>
                <div class="search-bar">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search for a city..." 
                        class="search-input"
                    >
                    <button id="searchBtn" class="search-btn">Search</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Current Weather Section -->
            <section class="current-weather" id="currentWeather">
                <div class="weather-loader">
                    <div class="spinner"></div>
                    <p>Loading weather data...</p>
                </div>
            </section>

            <!-- Weather Details Grid -->
            <section class="weather-details-grid">
                <div class="detail-card" id="humidityCard">
                    <div class="detail-header">
                        <span class="detail-icon">💧</span>
                        <h3>Humidity</h3>
                    </div>
                    <p class="detail-value">-</p>
                    <p class="detail-unit">%</p>
                </div>

                <div class="detail-card" id="windCard">
                    <div class="detail-header">
                        <span class="detail-icon">💨</span>
                        <h3>Wind Speed</h3>
                    </div>
                    <p class="detail-value">-</p>
                    <p class="detail-unit">m/s</p>
                </div>

                <div class="detail-card" id="pressureCard">
                    <div class="detail-header">
                        <span class="detail-icon">🔽</span>
                        <h3>Pressure</h3>
                    </div>
                    <p class="detail-value">-</p>
                    <p class="detail-unit">hPa</p>
                </div>

                <div class="detail-card" id="visibilityCard">
                    <div class="detail-header">
                        <span class="detail-icon">👁️</span>
                        <h3>Visibility</h3>
                    </div>
                    <p class="detail-value">-</p>
                    <p class="detail-unit">km</p>
                </div>
            </section>

            <!-- 5-Day Forecast -->
            <section class="forecast-section">
                <h2>5-Day Forecast</h2>
                <div class="forecast-grid" id="forecastGrid">
                    <!-- Forecast cards will be inserted here -->
                </div>
            </section>

            <!-- Recent Searches -->
            <section class="recent-searches">
                <h2>Recent Searches</h2>
                <div class="search-history" id="searchHistory">
                    <!-- Recent searches will be inserted here -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Weather data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap API</a></p>
            <p>&copy; 2024 Weather Dashboard. All rights reserved.</p>
        </footer>
    </div>

    <!-- Error Modal -->
    <div class="modal" id="errorModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Error</h2>
            <p id="errorMessage"></p>
            <button class="btn-primary" onclick="document.getElementById('errorModal').style.display='none'">OK</button>
        </div>
    </div>

    <script src="js/weather-app.js"></script>
</body>
</html>
